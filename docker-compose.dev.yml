# Development stack: PostgreSQL, Redis, and MyBibliotheca.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bibliotheca
      POSTGRES_USER: bibliotheca
      POSTGRES_PASSWORD: dev-postgres-password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bibliotheca:
    build: .
    ports:
      - "5054:5054"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      SECRET_KEY: dev-secret-key-change-in-production
      SECURITY_PASSWORD_SALT: dev-salt-change-in-production
      WTF_CSRF_ENABLED: "true"
      KUZU_DB_PATH: /app/data/kuzu
      GRAPH_DATABASE_ENABLED: "true"
      CACHE_REDIS_URL: redis://redis:6379/1
      KUZU_REDIS_CACHE_ENABLED: "true"
      KUZU_REDIS_CACHE_TTL_SECONDS: "10"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bibliotheca
      POSTGRES_USER: bibliotheca
      POSTGRES_PASSWORD: dev-postgres-password
      TIMEZONE: UTC
      READING_STREAK_OFFSET: "0"
      FLASK_DEBUG: "true"
      WORKERS: "6"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5054/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bibliotheca-test:
    build: .
    volumes:
      - ./data-test:/app/data
      - .:/app/test-source:ro
    environment:
      SECRET_KEY: test-secret-key
      SECURITY_PASSWORD_SALT: test-salt
      CACHE_REDIS_URL: redis://redis:6379/1
      KUZU_REDIS_CACHE_ENABLED: "true"
      GRAPH_DATABASE_ENABLED: "true"
      FLASK_DEBUG: "true"
      DEV_ADMIN_USERNAME: testadmin
      DEV_ADMIN_PASSWORD: TestPassword123!
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bibliotheca
      POSTGRES_USER: bibliotheca
      POSTGRES_PASSWORD: dev-postgres-password
    command: python3 -m pytest tests/ -v
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles:
      - test

volumes:
  postgres_dev_data:
